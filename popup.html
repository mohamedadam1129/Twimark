<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twimark</title>
  <style>
    :root { color: #172033; background: #f4f7fb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { width: 380px; margin: 0; padding: 16px; background: radial-gradient(circle at 100% 0%, #dceeff 0, transparent 36%), #f4f7fb; }
    .shell { overflow: hidden; border: 1px solid #dbe5f1; border-radius: 20px; background: rgba(255, 255, 255, .94); box-shadow: 0 16px 35px rgba(35, 63, 97, .13); }
    .header { display: flex; align-items: center; gap: 11px; padding: 18px 18px 15px; background: linear-gradient(135deg, #102338, #174b70); color: #fff; }
    .logo { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 11px; background: #fff; padding: 5px; box-shadow: 0 3px 10px rgba(0, 0, 0, .18); }
    .brand { flex: 1; min-width: 0; } h1 { margin: 0; font-size: 20px; letter-spacing: -.4px; } .tagline { margin: 2px 0 0; color: #cce5f8; font-size: 12px; }
    .count-card { min-width: 57px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.18); border-radius: 11px; background: rgba(255,255,255,.11); text-align: center; } #count { display: block; font-size: 18px; font-weight: 800; line-height: 1.05; } .count-label { font-size: 9px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: #d9edfb; }
    main { padding: 16px 18px 18px; } .hint { margin: 0 0 12px; color: #607084; font-size: 12px; }
    #status { min-height: 48px; padding: 11px 12px; border: 1px solid #dfe8f1; border-radius: 12px; background: #f8fbfe; color: #42546a; font-size: 12px; line-height: 1.4; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; } button { min-height: 42px; border: 1px solid #d8e2ec; border-radius: 11px; padding: 10px 12px; font: inherit; font-size: 12px; font-weight: 750; cursor: pointer; color: #314155; background: #fff; box-shadow: 0 1px 2px rgba(19, 42, 66, .04); transition: transform .15s ease, box-shadow .15s ease, background .15s ease; } button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(24, 58, 90, .12); } button:focus-visible, input:focus-visible { outline: 3px solid rgba(29, 155, 240, .28); outline-offset: 2px; } button.primary { border-color: #102338; background: #102338; color: white; } button.export { border-color: #167aca; background: linear-gradient(135deg, #1d9bf0, #2572d6); color: white; } button:disabled { cursor: not-allowed; opacity: .52; box-shadow: none; } .wide { grid-column: span 2; }
    #licensePanel { margin-top: 16px; padding: 14px; border: 1px solid #dce7f0; border-radius: 14px; background: linear-gradient(135deg, #fcfeff, #f3f9ff); } .pro-head { display: flex; align-items: center; gap: 8px; } .pro-badge { border-radius: 99px; padding: 3px 7px; background: #e4b04a; color: #573600; font-size: 9px; font-weight: 850; letter-spacing: .7px; } #licensePanel h2 { margin: 0; font-size: 14px; } #licensePanel p { margin: 5px 0 10px; color: #607084; font-size: 12px; line-height: 1.4; } input { width: 100%; margin: 4px 0; border: 1px solid #cbd9e6; border-radius: 9px; padding: 10px 11px; color: #172033; background: #fff; font: inherit; font-size: 12px; } input::placeholder { color: #8695a8; } #licenseMessage { min-height: 18px; margin-top: 9px; color: #607084; font-size: 11px; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <img class="logo" src="icon.png" alt="Twimark logo">
      <div class="brand"><h1>Twimark</h1><p class="tagline">Your X bookmarks, ready for AI</p></div>
      <div class="count-card"><span id="count">0</span><span class="count-label">Ready</span></div>
    </header>
    <main>
      <p class="hint">Open X History and select the <strong>Bookmarks</strong> tab to begin.</p>
      <div id="status">Ready when you are. Scan your saved bookmarks to export them.</div>
      <div class="actions">
        <button id="fullExport" class="primary wide">Scan all bookmarks</button>
        <button id="smartSync">Smart Sync · New only</button>
        <button id="downloadCsv" disabled>Download CSV</button>
        <button id="downloadMarkdown" class="export wide" disabled>Export to NotebookLM</button>
      </div>
      <section id="licensePanel">
        <div class="pro-head"><span class="pro-badge">PRO</span><h2>NotebookLM Export</h2></div>
        <p>Use your lifetime Pro license to unlock AI-ready Markdown exports.</p>
        <input id="licenseKey" type="password" autocomplete="off" placeholder="Lemon Squeezy license key">
        <input id="licenseEmail" type="email" autocomplete="email" placeholder="Checkout email address">
        <div class="actions"><button id="activateLicense" class="primary">Activate Pro</button><button id="deactivateLicense">Deactivate device</button><button id="buyPro" class="export wide">Get Twimark Pro</button></div>
        <div id="licenseMessage"></div>
      </section>
    </main>
  </div>
  <script src="license-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
